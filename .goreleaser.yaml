version: 2

project_name: nemesis

before:
  hooks:
    - go mod tidy

# GUI-only Ebiten stealth game: a cgo/Metal darwin build shipped as a Homebrew cask.
# Built on a macOS runner (a Linux clang cannot cross-build a darwin cgo binary).
# Linux/Windows users build from source.
builds:
  - id: nemesis
    main: ./cmd/nemesis
    binary: nemesis
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [nemesis]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  name_template: "v{{ .Version }}"

# Homebrew cask: the macOS-only native Ebiten window.
homebrew_casks:
  - name: nemesis
    repository:
      owner: danielriddell21
      name: homebrew-tap
      branch: trunk
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/danielriddell21/nemesis
    description: A procedurally generated first-person stealth game hunted by an Alien-Isolation-style AI
    license: MIT
    caveats: "nemesis opens an Ebiten window and is macOS-only; on Linux/Windows, build from source."
