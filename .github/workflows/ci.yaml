name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:

jobs:
  ci:
    uses: danielriddell21/github-actions/.github/workflows/ci.yaml@v2
    # Read is enough now. The tag job checks out and pushes with tag-token, so
    # the workflow token no longer needs to write anything here.
    permissions:
      contents: read
    with:
      # A release candidate; promote.yaml publishes the stable version.
      pre: true
      ebiten: true
      test-command: xvfb-run -a go test -coverprofile=coverage.txt ./...
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      tag-token: ${{ secrets.NEMESIS_TOKEN }}

  # The balance gate, the same command as `just eval`. Its pass marks live in
  # internal/eval, so this job and a local run can never disagree.
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go run ./tools/eval
