silent: false

unleash:
  threshold:
    efficacy: 45        # ≥45% of tested mutants must be killed
    mutant-coverage: 50 # skip mutants in code with <50% line coverage
  exclude-files:
    - "cmd/.*"
    # Numeric-heavy code where a mutated arithmetic constant shifts a pixel or
    # a sample by an imperceptible amount no reasonable test asserts on — the
    # raycaster and the PCM synthesiser. Mutation testing here is noise.
    - "internal/render/.*"
    - "internal/audio/.*"

mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-assignments:
    enabled: false
  invert-bitwise:
    enabled: false
  invert-bwassign:
    enabled: false
  invert-negatives:
    enabled: true
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: false
  remove-self-assignments:
    enabled: false
